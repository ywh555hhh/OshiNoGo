name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # action 全部 pin 到 commit SHA：可变 tag（@v4）理论上可被上游重新指向，
      # 而这条 workflow 持有 pages:write 与 id-token:write 权限。
      # 保持新鲜靠 .github/dependabot.yml —— pin 而不加 dependabot，
      # 只是把 action 永久冻在老版本。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 门禁：类型 + lint + 测试。以前这里只有 build，没有任何检查。
      # 放在同一个 job 里而不是拆成两个：上传产物发生在其后，verify 挂了就发布不了，
      # 效果等价但不必把 checkout / setup-node / install 整段重复一遍。
      - name: Verify（类型 + lint + 测试）
        run: npm run verify
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build frontend for Pages
        run: npm run build:pages
        working-directory: frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
