name: Deploy GitHub Pages

# 早期阶段这里只做一件事：把页面发布出去。
#
# 类型检查没有被放弃 —— `build:pages` 本身就是 `tsc -b && vite build`，
# 所以有类型错误时构建会失败、部署不会发生，Pages 保留上一次成功的版本。
# 去掉的只是 lint 与测试门禁（本地用 `npm run verify` 跑）。
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止两次部署互相覆盖：后推的那次取消前一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build:pages
        working-directory: frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
